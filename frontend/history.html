<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>History · Phish & Port</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💠</text></svg>" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
        .page {
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px 20px 40px;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .page-header h1 {
            font-family: "Outfit", sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
        }
        .page-header .user {
            color: var(--muted);
            font-size: 0.85rem;
        }
        .page-header .user a {
            color: var(--cyan);
            text-decoration: none;
        }
        .page-header .user a:hover {
            text-decoration: underline;
        }

        .history-list {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .history-list .header {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 0.5fr;
            gap: 12px;
            padding: 10px 16px;
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        #scan-list .scan-item {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 0.5fr;
            gap: 12px;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid rgba(30, 41, 59, 0.5);
            font-size: 0.82rem;
        }
        #scan-list .scan-item:last-child {
            border-bottom: none;
        }
        #scan-list .scan-item:hover {
            background: var(--surface-2);
        }
        .scan-item .target {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .scan-item .score {
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 650;
            display: inline-block;
            width: fit-content;
        }
        .score.excellent {
            background: rgba(52, 211, 153, 0.12);
            color: var(--green);
        }
        .score.good {
            background: rgba(56, 189, 248, 0.12);
            color: var(--blue);
        }
        .score.warning {
            background: rgba(251, 191, 36, 0.12);
            color: var(--amber);
        }
        .score.critical {
            background: rgba(251, 113, 133, 0.12);
            color: var(--red);
        }
        .scan-item .date {
            color: var(--faint);
            font-size: 0.65rem;
        }
        .scan-item .download-btn {
            padding: 3px 8px;
            background: var(--cyan);
            color: #061018;
            border: none;
            border-radius: 4px;
            font-size: 0.55rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }
        .scan-item .download-btn:hover {
            background: #67E8F9;
        }

        .empty-state {
            padding: 30px 16px;
            text-align: center;
            color: var(--muted);
        }
        .empty-state a {
            color: var(--cyan);
            text-decoration: none;
        }
        .empty-state a:hover {
            text-decoration: underline;
        }

        .login-prompt {
            padding: 24px 16px;
            text-align: center;
            background: var(--surface-2);
            border-radius: 8px;
            margin: 20px 0;
        }
        .login-prompt h3 {
            font-family: "Outfit", sans-serif;
            font-size: 1rem;
        }
        .login-prompt p {
            color: var(--muted);
            font-size: 0.85rem;
            margin: 4px 0 12px;
        }
        .login-prompt .btn {
            padding: 8px 20px;
            background: var(--cyan);
            color: #061018;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }
        .login-prompt .btn:hover {
            background: #67E8F9;
        }

        .footer-mini {
            text-align: center;
            padding: 20px 0 10px;
            border-top: 1px solid var(--border);
            margin-top: 30px;
        }
        .footer-mini .links {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        .footer-mini .links a {
            color: var(--muted);
            font-size: 0.75rem;
            text-decoration: none;
        }
        .footer-mini .links a:hover {
            color: var(--cyan);
        }

        @media (max-width: 700px) {
            #scan-list .scan-item {
                grid-template-columns: 1fr;
                gap: 4px;
            }
            .history-list .header {
                display: none;
            }
            .scan-item .date {
                font-size: 0.6rem;
            }
            .page {
                padding: 16px 14px 30px;
            }
        }
    </style>
</head>
<body>

<div class="page">

    <!-- Header -->
    <header class="page-header">
        <h1>📋 History</h1>
        <div class="user">
            <span id="username-display"></span>
            <a href="dashboard.html">Profile</a>
        </div>
    </header>

    <div id="history-content"></div>

    <div style="margin-top:16px;text-align:center;">
        <a href="newscan.html" style="color:var(--muted);font-size:0.85rem;text-decoration:none;">← Back to Scanner</a>
    </div>

    <!-- Footer -->
    <footer class="footer-mini">
        <p style="font-size:0.7rem;color:var(--faint);">Made with 💠 by <a href="developer.html" style="color:var(--cyan);text-decoration:none;">Aceya</a></p>
        <div class="links">
            <a href="https://www.instagram.com/aceyathedeveloper/" target="_blank">Instagram</a>
            <a href="https://github.com/aceyatech-ui" target="_blank">GitHub</a>
            <a href="https://www.linkedin.com/in/chisom-okafor-5859b93a8" target="_blank">LinkedIn</a>
            <a href="https://aceyaai.substack.com" target="_blank">Substack</a>
            <a href="https://wa.me/2349057533854" target="_blank">WhatsApp</a>
        </div>
    </footer>

</div>

<script src="app.js"></script>
</body>
</html>
